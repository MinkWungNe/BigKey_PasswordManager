[package]
name = "bigkey"
version = "0.1.0"
description = "BigKey - A Zero-Knowledge Local-First Password Manager"
authors = ["MinkWungNe Studio"]
edition = "2021"

[lib]
name = "bigkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive", "serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
